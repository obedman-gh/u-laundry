<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow">
    <title>
      Lacak pesanan — ULaundry
    </title>
    <link rel="stylesheet" href="/ui/tokens.css">
    <link rel="stylesheet" href="/ui/ui.css">
    <script src="/ui/ui.js" defer></script>
    <link rel="stylesheet" href="/customers.css">
    <script src="/tracking.js" defer></script>
    <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#007bff">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/pwa/pwa.css">
  <script src="/pwa/pwa.js" defer></script>
</head>
  <body class="public-page">
    <main>
      <strong>
        ULaundry — Perumahan Viola
      </strong>
      <h1>
        Lacak pesanan
      </h1>
      <p>
        Tautan pelacakan bersifat rahasia. Jangan bagikan kepada orang lain.
      </p>
      <form id="tracking-form" class="card">
        <label for="token">
          Token pelacakan
        </label>
        <input id="token" required minlength="43" maxlength="43" autocomplete="off" spellcheck="false">
        <button id="track" type="submit">
          Lihat status
        </button>
      </form>
      <p data-state="info" class="ui-alert" id="message" role="status" aria-live="polite"></p>
      <section id="result" class="card" hidden>
        <h2>
          Status pesanan
        </h2>
        <p>
          Kode:
          <span id="tracking-code"></span>
        </p>
        <p id="status"></p>
        <p id="estimate"></p>
        <p id="service-message"></p>
      </section>
    </main>
  </body>
</html>
