<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pelanggan — ULaundry</title><link rel="stylesheet" href="/customers.css"><script src="/customers.js" defer></script></head>
<body><main><nav><strong>ULaundry</strong><a href="/">Kembali ke antrean</a></nav><h1>Pelanggan</h1><p>Cukup nama untuk pelanggan langsung. Kontak, alamat, dan catatan hanya diisi bila diperlukan untuk layanan. Jangan simpan data sensitif.</p><p id="message" role="status" aria-live="polite">Memeriksa sesi…</p>
<section id="management" hidden><div class="card"><h2>Cari pelanggan</h2><form id="search-form"><label for="search">Nama atau nomor kontak</label><input id="search" maxlength="100" type="search"><button type="submit">Cari</button></form><ul id="customers"></ul><button type="button" id="previous">Sebelumnya</button><span id="page-info"></span><button type="button" id="next">Berikutnya</button></div>
<div class="grid"><form class="card" id="customer-form"><h2 id="form-title">Tambah pelanggan</h2><label for="name">Nama</label><input id="name" required maxlength="100" autocomplete="name"><label for="contact">Nomor kontak (opsional)</label><input id="contact" type="tel" maxlength="64" autocomplete="tel"><label for="address">Alamat (opsional)</label><textarea id="address" maxlength="500" autocomplete="street-address"></textarea><label for="notes">Catatan layanan (opsional)</label><textarea id="notes" maxlength="1000"></textarea><button id="save" type="submit">Simpan pelanggan</button><button id="new" type="button">Pelanggan baru</button></form>
<div class="card"><h2>Riwayat pesanan</h2><p id="selected">Pilih pelanggan untuk melihat riwayat.</p><ul id="orders"></ul><button type="button" id="orders-previous" disabled>Sebelumnya</button><button type="button" id="orders-next" disabled>Berikutnya</button></div></div></section></main></body></html>
