<!doctype html>
<html lang="id"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk staf — ULaundry</title>
  <link rel="stylesheet" href="/ui/tokens.css"><link rel="stylesheet" href="/ui/ui.css">
  <script src="/ui/ui.js" defer></script><script src="/login.js" defer></script>
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml"></head><body class="login-page"><main>
  <section class="login-box" aria-labelledby="login-title">
    <div class="app-brand"><span>ULaundry POS</span><small>Perumahan Viola</small></div>
    <h1 id="login-title">Masuk ke akun staf</h1>
    <p class="muted">Gunakan akun yang diberikan oleh pemilik.</p>
    <form id="formLogin">
      <label for="username">Nama pengguna</label>
      <input id="username" name="username" required maxlength="50" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="pesan-error">
      <label for="password">Kata sandi</label>
      <div class="password-wrapper">
        <input id="password" name="password" type="password" required maxlength="72" autocomplete="current-password" aria-describedby="pesan-error">
        <button type="button" class="toggle-password" id="togglePassword" title="Tampilkan kata sandi" aria-label="Tampilkan kata sandi" aria-pressed="false" aria-controls="password">
          <svg id="eyeOpen" aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg id="eyeClosed" class="eye-closed" aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M4 7c-2 2-3 5-3 5s4 8 11 8c3 0 5-1 7-3M9 4c1 0 2 0 3 0 7 0 11 8 11 8l-2 3"></path></svg>
        </button>
      </div>
      <p id="pesan-error" class="ui-alert" role="alert" aria-live="assertive"></p>
      <button type="submit" id="btnLogin" class="btn-submit">Masuk</button>
    </form>
    <p class="login-footer"><a href="/tracking.html">Lacak pesanan pelanggan</a></p>
  </section>
</main></body></html>
