<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Kasir - ULaundry</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
        }
        .login-box h2 {
            margin-top: 0;
            color: #1f2937;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4b5563;
            font-size: 0.875rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        /* Tambahan CSS khusus untuk bungkus input password dan ikon mata */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 2.5rem; /* Kasih ruang di kanan biar teks gak ketimpa ikon */
        }
        .toggle-password {
            position: absolute;
            right: 0.5rem;
            cursor: pointer;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
        }
        .toggle-password:hover {
            color: #2563eb;
        }

        button.btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }
        button.btn-submit:hover {
            background-color: #1d4ed8;
        }
        button.btn-submit:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }
        #pesan-error {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ULaundry POS</h2>
        <form id="formLogin">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required autocomplete="current-password">
                    <!-- Ikon SVG Mata -->
                    <span class="toggle-password" id="togglePassword" title="Tampilkan Password">
                        <!-- Ikon Mata Terbuka -->
                        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Ikon Mata Tercoret (Disembunyikan default) -->
                        <svg id="eyeClosed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="btn-submit">Masuk</button>
        </form>
        <div id="pesan-error"></div>
    </div>

    <script>
        // Logika Toggle Password
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eyeOpen');
        const eyeClosed = document.getElementById('eyeClosed');

        togglePassword.addEventListener('click', function () {
            // Ngecek tipe input, kalau password ubah jadi text, dan sebaliknya
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Ganti ikon
            if (type === 'password') {
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
                this.setAttribute('title', 'Tampilkan Password');
            } else {
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
                this.setAttribute('title', 'Sembunyikan Password');
            }
        });

        // Logika Login (Sama seperti sebelumnya)
        document.getElementById('formLogin').addEventListener('submit', function(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('pesan-error');

            errorDiv.style.display = 'none';
            btn.textContent = 'Memverifikasi...';
            btn.disabled = true;

            fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(async response => {
                const data = await response.json().catch(() => ({}));
                
                if (response.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/index.html';
                } else {
                    errorDiv.textContent = data.pesan || data || 'Gagal login. Periksa kembali kredensial Anda.';
                    errorDiv.style.display = 'block';
                    btn.textContent = 'Masuk';
                    btn.disabled = false;
                }
            })
            .catch(error => {
                errorDiv.textContent = 'Error: Server tidak merespon.';
                errorDiv.style.display = 'block';
                btn.textContent = 'Masuk';
                btn.disabled = false;
                console.error(error);
            });
        });
    </script>

</body>
</html>
